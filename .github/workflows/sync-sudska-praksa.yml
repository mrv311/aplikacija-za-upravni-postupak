name: Sinkronizacija sudske prakse (odluke.sudovi.hr)

on:
  schedule:
    # Pokreni 1. u mjesecu u 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch: # Omogućava i ručno pokretanje iz GitHub sučelja

jobs:
  sync-praksa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Preuzmi kod repozitorija
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Pokreni sinkronizaciju sudske prakse
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_GEMINI_KEY: ${{ secrets.GOOGLE_GEMINI_KEY }}
        run: npm run sync-practice

      - name: Komitaj i pošalji nove odluke na master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sudska-praksa/
          if git diff --staged --quiet; then
            echo "Nema novih sudskih odluka za komit."
          else
            git commit -m "chore(praksa): automatska mjesečna sinkronizacija sudske prakse [skip ci]"
            git push origin master
          fi
